<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="CAIRN plans safe walks for the first astronauts on Mars, at Jezero and Gale craters: routes on real NASA terrain, oxygen, radiation, radio contact and emergencies. Works offline." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CAIRN — Marswalk Route Planner" />
    <meta property="og:description" content="Plan safe walks for the first astronauts on Mars, on real NASA terrain at Jezero and Gale craters." />
    <title>CAIRN — Marswalk Route Planner</title>
    <meta name="theme-color" content="#0b0d10" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cellipse cx='16' cy='24' rx='10' ry='4.4' fill='%23e8a15c'/%3E%3Cellipse cx='16' cy='16.5' rx='7.2' ry='3.8' fill='%23f0b878'/%3E%3Cellipse cx='16' cy='9.8' rx='4.6' ry='3.2' fill='%23f7d2a0'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="loading">
      <div class="load-box">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="24" rx="10" ry="4.4" fill="#e8a15c" /><ellipse cx="16" cy="16.5" rx="7.2" ry="3.8" fill="#f0b878" /><ellipse cx="16" cy="9.8" rx="4.6" ry="3.2" fill="#f7d2a0" /></svg>
        <h1>CAIRN</h1>
        <p class="tagline">Crew Assisted Integrated Route Navigator</p>
        <div class="bar"><i id="load-bar"></i></div>
        <p id="load-label">Starting…</p>
        <p id="load-slow" hidden>Taking a while? <a id="load-lite" href="?q=low">Open the lighter version</a> (coarser mesh and 50 cm images).</p>
      </div>
    </div>

    <div id="app" hidden>
      <main id="stage">
        <div id="scene"></div>
        <div id="hud" hidden></div>
        <div id="probe" hidden></div>
        <div id="pin-menu" hidden></div>
      </main>

      <header id="topbar">
        <div class="brand pill">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="24" rx="10" ry="4.4" fill="#e8a15c" /><ellipse cx="16" cy="16.5" rx="7.2" ry="3.8" fill="#f0b878" /><ellipse cx="16" cy="9.8" rx="4.6" ry="3.2" fill="#f7d2a0" /></svg>
          <strong>CAIRN</strong>
          <span class="sep"></span>
          <button id="site-switch" aria-haspopup="menu" title="Switch site"><span id="site-name"></span><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
          <div id="site-menu" role="menu" hidden></div>
        </div>
        <nav id="views" class="pill seg" aria-label="View"></nav>
        <div class="top-actions pill"></div>
      </header>

      <aside id="left" class="panel"></aside>
      <aside id="right" class="panel"></aside>
      <section id="bottom" class="panel"></section>

      <div id="mapwidgets">
        <div id="compass" title="North"><i></i><b>N</b></div>
        <div id="scalebar"><i></i><span></span></div>
        <div id="exag-tag" hidden></div>
      </div>
      <div id="nav" class="pill" aria-label="Camera controls"></div>
      <div id="view-menu" hidden></div>
      <div id="about-menu" class="menu" role="menu" hidden></div>
      <div id="nav-hint"></div>
      <div id="alert" role="alert" hidden></div>
      <div id="card" hidden></div>
      <div id="toast" role="status" aria-live="polite" hidden></div>
      <div id="demo" hidden></div>
    </div>

    <div id="briefing" hidden></div>
    <div id="modal" hidden></div>
    <div id="pano" hidden></div>
    <div id="print" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
